<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="swasthyaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glow -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner Subtle Border -->
  <rect x="36" y="36" width="440" height="440" rx="106" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Medical Cross & Heart Shape Container -->
  <g transform="translate(256, 240) scale(0.95)">
    <!-- Stylized Heart Base -->
    <path d="M 0,140 C -120,40 -200,-40 -200,-110 C -200,-170 -150,-210 -90,-210 C -40,-210 -15,-180 0,-140 C 15,-180 40,-210 90,-210 C 150,-210 200,-170 200,-110 C 200,-40 120,40 0,140 Z" 
          fill="url(#swasthyaGradient)" 
          opacity="0.25" />

    <!-- Solid Medical Cross with Rounded Edges -->
    <rect x="-36" y="-130" width="72" height="260" rx="36" fill="#ffffff" />
    <rect x="-130" y="-36" width="260" height="72" rx="36" fill="#ffffff" />

    <!-- Center Pulse Line (ECG / Health Wave) -->
    <path d="M -110,0 L -50,0 L -30,-45 L -10,55 L 15,-65 L 35,40 L 55,-20 L 70,0 L 110,0" 
          fill="none" 
          stroke="url(#bgGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Organic Wellness Leaf Emblem at Top Right -->
    <path d="M 50,-130 C 110,-190 190,-160 170,-90 C 120,-80 80,-100 50,-130 Z" 
          fill="#34d399" 
          opacity="0.9" />
  </g>

  <!-- Bottom Brand Dot Accent -->
  <circle cx="256" cy="420" r="8" fill="#38bdf8" />
</svg>
